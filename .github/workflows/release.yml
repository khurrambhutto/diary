name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sysdeps: |
              sudo apt-get update && sudo apt-get install -y \
                libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: ${{ matrix.sysdeps }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diary-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/

  create-release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diary-*
          merge-multiple: true

      - name: Generate update.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG_NAME="${{ github.ref_name }}"
          BASE_URL="https://github.com/khurrambhutto/diary/releases/download/${TAG_NAME}"

          APPIMAGE_FILE=$(ls *.AppImage 2>/dev/null | head -1)
          LINUX_URL=""; LINUX_SIG=""
          [ -n "$APPIMAGE_FILE" ] && LINUX_URL="${BASE_URL}/${APPIMAGE_FILE}"
          SIG_FILE=$(ls *.AppImage.sig 2>/dev/null | head -1)
          [ -n "$SIG_FILE" ] && LINUX_SIG=$(cat "$SIG_FILE")

          TARGZ_FILE=$(ls *.app.tar.gz 2>/dev/null | head -1)
          DARWIN_URL=""; DARWIN_SIG=""
          [ -n "$TARGZ_FILE" ] && DARWIN_URL="${BASE_URL}/${TARGZ_FILE}"
          SIG_TARGZ=$(ls *.app.tar.gz.sig 2>/dev/null | head -1)
          [ -n "$SIG_TARGZ" ] && DARWIN_SIG=$(cat "$SIG_TARGZ")

          MSI_FILE=$(ls *.msi 2>/dev/null | head -1)
          WIN_URL=""; WIN_SIG=""
          [ -n "$MSI_FILE" ] && WIN_URL="${BASE_URL}/${MSI_FILE}"
          MSI_SIG_FILE=$(ls *.msi.sig 2>/dev/null | head -1)
          [ -n "$MSI_SIG_FILE" ] && WIN_SIG=$(cat "$MSI_SIG_FILE")
          if [ -z "$WIN_SIG" ]; then
            SETUP_SIG_FILE=$(ls *.setup.exe.sig 2>/dev/null | head -1)
            [ -n "$SETUP_SIG_FILE" ] && WIN_SIG=$(cat "$SETUP_SIG_FILE")
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the release for details." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url "$LINUX_URL" \
            --arg linux_sig "$LINUX_SIG" \
            --arg darwin_url "$DARWIN_URL" \
            --arg darwin_sig "$DARWIN_SIG" \
            --arg win_url "$WIN_URL" \
            --arg win_sig "$WIN_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: $linux_url
                },
                "darwin-x86_64": {
                  signature: $darwin_sig,
                  url: $darwin_url
                },
                "darwin-aarch64": {
                  signature: $darwin_sig,
                  url: $darwin_url
                },
                "windows-x86_64": {
                  signature: $win_sig,
                  url: $win_url
                }
              }
            }' > update.json

          echo "Generated update.json:"
          cat update.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Diary ${{ github.ref_name }}
          body: |
            ## Diary ${{ github.ref_name }}

            See the assets below to download the build for your platform.
          draft: false
          prerelease: false
          files: |
            **/*.deb
            **/*.AppImage
            **/*.AppImage.sig
            **/*.app.tar.gz
            **/*.app.tar.gz.sig
            **/*.dmg
            **/*.msi
            **/*.msi.sig
            **/*.msi.zip
            **/*.msi.zip.sig
            **/*.setup.exe
            **/*.setup.exe.sig
            **/*.nsis.zip
            **/*.nsis.zip.sig
            update.json