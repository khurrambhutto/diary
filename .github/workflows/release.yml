name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sysdeps: |
              sudo apt-get update && sudo apt-get install -y \
                libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: ${{ matrix.sysdeps }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diary-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/

  create-release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diary-*
          merge-multiple: true

      - name: Generate update.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          BASE_URL="https://github.com/khurrambhutto/diary/releases/download/${TAG_NAME}"

          echo '{' > update.json
          echo '  "version": "'"$VERSION"'",' >> update.json
          echo '  "notes": "See the release for details.",' >> update.json
          echo '  "pub_date": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> update.json
          echo '  "platforms": {' >> update.json

          APPIMAGE_FILE="$(find . -type f -name '*.AppImage' -print -quit)"
          if [ -n "$APPIMAGE_FILE" ]; then
            APPIMAGE_NAME="$(basename "$APPIMAGE_FILE")"
            SIG="$(cat "${APPIMAGE_FILE}.sig" 2>/dev/null || echo '')"
            echo '    "linux-x86_64": {' >> update.json
            echo '      "signature": "'"$SIG"'",' >> update.json
            echo '      "url": "'"$BASE_URL"'/'"$APPIMAGE_NAME"'"' >> update.json
            echo '    },' >> update.json
          fi

          TARGZ_FILE="$(find . -type f -name '*.app.tar.gz' -print -quit)"
          if [ -n "$TARGZ_FILE" ]; then
            TARGZ_NAME="$(basename "$TARGZ_FILE")"
            SIG="$(cat "${TARGZ_FILE}.sig" 2>/dev/null || echo '')"
            echo '    "darwin-x86_64": {' >> update.json
            echo '      "signature": "'"$SIG"'",' >> update.json
            echo '      "url": "'"$BASE_URL"'/'"$TARGZ_NAME"'"' >> update.json
            echo '    },' >> update.json
            echo '    "darwin-aarch64": {' >> update.json
            echo '      "signature": "'"$SIG"'",' >> update.json
            echo '      "url": "'"$BASE_URL"'/'"$TARGZ_NAME"'"' >> update.json
            echo '    },' >> update.json
          fi

          MSI_FILE="$(find . -type f -name '*.msi' -print -quit)"
          SETUP_FILE="$(find . -type f -name '*.setup.exe' -print -quit)"
          if [ -n "$MSI_FILE" ]; then
            MSI_NAME="$(basename "$MSI_FILE")"
            SIG="$(cat "${MSI_FILE}.sig" 2>/dev/null || echo '')"
            if [ -z "$SIG" ] && [ -n "$SETUP_FILE" ]; then
              SIG="$(cat "${SETUP_FILE}.sig" 2>/dev/null || echo '')"
            fi
            echo '    "windows-x86_64": {' >> update.json
            echo '      "signature": "'"$SIG"'",' >> update.json
            echo '      "url": "'"$BASE_URL"'/'"$MSI_NAME"'"' >> update.json
            echo '    }' >> update.json
          fi

          echo '  }' >> update.json
          echo '}' >> update.json

          echo "Generated update.json:"
          cat update.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Diary ${{ github.ref_name }}
          body: |
            ## Diary ${{ github.ref_name }}

            See the assets below to download the build for your platform.
          draft: false
          prerelease: false
          files: |
            **/*.deb
            **/*.AppImage
            **/*.AppImage.sig
            **/*.app.tar.gz
            **/*.app.tar.gz.sig
            **/*.dmg
            **/*.msi
            **/*.msi.sig
            **/*.msi.zip
            **/*.msi.zip.sig
            **/*.setup.exe
            **/*.setup.exe.sig
            **/*.nsis.zip
            **/*.nsis.zip.sig
            update.json
