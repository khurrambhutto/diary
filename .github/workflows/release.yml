name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', f'Tag {ref} does not match package version {version}'
          print(f'Building Diary {version}')
          PY
  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-dpms0-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev libxcb-res0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libvulkan-dev
      - name: Check and test
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/diary packaging/diary.desktop artifact/
          cp packaging/icons/icon.png artifact/com.khurram.diary.png
          cp README.md artifact/
          cp assets/fonts/OFL-*.txt artifact/
          tar -czf diary-${{ matrix.target }}.tar.gz -C artifact .
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p Diary.app/Contents/MacOS Diary.app/Contents/Resources
          cp target/${{ matrix.target }}/release/diary Diary.app/Contents/MacOS/
          cp packaging/Info.plist Diary.app/Contents/
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Diary.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Diary.app/Contents/Info.plist
          cp packaging/icons/icon.icns Diary.app/Contents/Resources/
          cp assets/fonts/OFL-*.txt Diary.app/Contents/Resources/
          codesign --force --deep --sign - Diary.app
          tar -czf diary-${{ matrix.target }}.app.tar.gz Diary.app
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact
          Copy-Item target/${{ matrix.target }}/release/diary.exe artifact/
          Copy-Item README.md artifact/
          Copy-Item assets/fonts/OFL-*.txt artifact/
          Compress-Archive -Path artifact/* -DestinationPath diary-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: diary-${{ matrix.target }}
          path: |
            diary-*.tar.gz
            diary-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diary-*
          merge-multiple: true
      - name: Check archives and generate checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = [
              'diary-x86_64-unknown-linux-gnu.tar.gz',
              'diary-aarch64-apple-darwin.app.tar.gz',
              'diary-x86_64-apple-darwin.app.tar.gz',
              'diary-x86_64-pc-windows-msvc.zip',
          ]
          with open('SHA256SUMS', 'w') as sums:
              for name in expected:
                  path = Path(name)
                  assert path.is_file() and path.stat().st_size > 0, f'Missing or empty archive: {name}'
                  with path.open('rb') as archive:
                      digest = hashlib.file_digest(archive, 'sha256').hexdigest()
                  sums.write(f'{digest}  {name}\n')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            diary-*.tar.gz
            diary-*.zip
            SHA256SUMS
