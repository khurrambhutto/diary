[package]
name = "diary"
version = "0.2.0"
edition = "2024"
description = "A quiet notebook for daily writing and small habits."
authors = ["Khurram Bhutto"]
repository = "https://github.com/khurrambhutto/diary"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
gpui-kit = "0.7.3"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
ureq = "3.4.2"

[profile.release]
lto = "thin"
strip = true
